apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-analysis-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: route-analysis-service }
  template:
    metadata:
      labels: { app: route-analysis-service }
    spec:
      containers:
      - name: service
        image: route-analysis-service:local
        ports: [{ containerPort: 8084 }]
        livenessProbe: { httpGet: { path: /healthz, port: 8084 } }
        readinessProbe: { httpGet: { path: /readyz, port: 8084 } }
